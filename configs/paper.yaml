# Faithful implementation of the method described in the ECAI 2024
# paper: bi-encoder + structure/feature-graph convolution modules
# trained jointly with L = Le + a*Ls + b*Ld (Eq. 13).
#
# Choices the paper leaves open are pinned to the values below and are
# all tunable here.
run_name: paper
seed: 52313
tf32: false
no_cuda: false

model:
  bert_model: google/bert_uncased_L-8_H-512_A-8
  lowercase: true
  out_dim: 1
  add_linear: false

data:
  root: data/processed/graph_tempel
  variant: new_entities
  pretokenized: true
  max_context_length: 128
  max_cand_length: 128
  use_title_in_pool: false
  pool_text_limit: 128

graph:
  enabled: true
  nhid1: 768                   # GCN hidden size, first layer
  nhid2: 256                   # GCN hidden size, second layer
  dropout: 0.5
  knn_k: 3                     # uses graphs/{year}/knn_edges_k3.txt
  combine: sum                 # emb1+emb2+com1+com2 ('attention' = AM-GCN attention)
  normalization: symmetric     # paper Eq. 6/7 ('row' = D^-1 (A + I))
  loss:
    a_common: 0.5              # weight of consistency loss Ls (train.sh --theta)
    b_hsic: 0.0                # weight of HSIC loss Ld (train.sh --beta was 0)
    hsic_paper_scaling: true   # apply the paper's (n-1)^-2 factor
    chunk_rows: 2048           # memory bound for the n x n loss terms
  fusion:
    mode: score_add            # graph-text score fusion
    scale: 40.0                # tanh(score2) * scale
    tanh: true
  optimizer:                   # separate param group for the GCN
    lr: 5.0e-4                 # GCN/fusion learning rate
    weight_decay: 5.0e-4

train:
  batch_size: 64
  eval_batch_size: 16
  learning_rate: 1.0e-5
  num_epochs: 1
  warmup_proportion: 0.1
  max_grad_norm: 1.0
  type_optimization: all_encoder_layers
  gradient_accumulation_steps: 1
  shuffle: false
  amp: null
  eval_on_validation: true
  validation_max_samples: 4096  # diagnostic metric subsample; null = full set
  eval_before_training: false
  eval_encode_batch_size: 128

eval:
  top_k: 64
  encode_batch_size: 128
  amp: null
  cache_pool_encodings: true
